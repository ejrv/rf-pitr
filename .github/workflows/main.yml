name: Mirror File

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'File URL?'
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download File
        run: |
          wget -O downloaded_file.ext ${{ github.event.inputs.file_url }}

      - name: Add and Commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add downloaded_file.ext
          git commit -m "Added new file from mirror"
          git push
